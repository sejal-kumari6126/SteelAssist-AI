<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SteelAssist AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>🤖 SteelAssist AI</h1>
    <p class="subtitle">
        AI Knowledge Assistant for Tata Steel Shopfloor Workforce
    </p>
    <textarea
        id="question"
        placeholder="Ask your question..."
    ></textarea>

    <button id="askBtn">
        Ask AI
    </button>

    <div class="answerBox">
        <h3>Answer</h3>
        <p id="answer">
            Your answer will appear here...
        </p>
    </div>
</div>

<script src="script.js"></script>

</body>
</html>
